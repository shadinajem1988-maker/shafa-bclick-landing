<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>הדף לא נמצא | שפה בקליק</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--bg-alt:#f6f9fb;--ink:#15181d;--gray:#5a6472;--teal:#00B5A1;--teal-dark:#00897B;--border:#e8edf3;--font:'Rubik','Heebo',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--white);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,181,161,.12),transparent 70%);top:-200px;left:-120px;filter:blur(50px);pointer-events:none}
img.logo{height:40px;margin-bottom:34px;position:relative}
.code{font-size:clamp(5rem,18vw,9rem);font-weight:900;line-height:1;letter-spacing:-3px;color:var(--ink);position:relative}
.code span{color:var(--teal-dark)}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;margin:8px 0 10px;color:var(--ink);position:relative}
p{color:var(--gray);font-size:1.05rem;max-width:440px;margin-bottom:28px;position:relative}
.btn{position:relative;display:inline-flex;align-items:center;gap:9px;background:var(--teal);color:#000;font-weight:700;font-size:1.05rem;padding:15px 32px;border-radius:50px;text-decoration:none;box-shadow:0 12px 34px -8px rgba(0,181,161,.45);transition:.22s}
.btn:hover{background:var(--teal-dark);color:#fff;transform:translateY(-3px)}
</style></head><body>
<div class="glow"></div>
<img class="logo" src="assets/logo-header.png" alt="שפה בקליק">
<div class="code">4<span>0</span>4</div>
<h1>אופס, הדף הזה לא קיים</h1>
<p>נראה שהקישור שבר או שהדף הוסר. בוא נחזיר אותך לדרך הנכונה.</p>
<a class="btn" href="index.html">&#8594; חזרה לדף הבית</a>
</body></html>
